[project]
name = "gsrest"
version = "1.16.0rc2"
description = "GraphSense API REST API"
readme = "README.md"
keywords = ["GraphSense API"]
requires-python = ">=3.10"
license-files = ["LICENSE"]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "asgi-lifespan>=2.1.0",
    "async-lru>=2.0.4",
    "fastapi>=0.115.0",
    "graphsense-lib[conversions,tagstore]>=2.8.18",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "redis>=7.1.0",
    "uvicorn[standard]>=0.32.0",
    "aiohttp>=3.8.0"
]

[project.urls]
Homepage = "https://github.com/graphsense/graphsense-REST/"
Repository = "https://github.com/graphsense/graphsense-REST/"
Changelog = "https://github.com/graphsense/graphsense-REST/blob/master/CHANGELOG.md"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gsrest*"]
exclude = ["clients*", "tests*", "scripts*", "gsrest.test", "gsrest.test.*"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "regression: mark test as regression test",
    "migration: mark test as FastAPI migration comparison test",
    "loki_generated: mark test as generated from Loki API logs",
]
addopts = "-m 'not regression and not migration'"
testpaths = [
    "tests",
    "gsrest",
]
norecursedirs = [
    "clients",
    "build",
    "dist",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "tests/test_*.py",
    "setup.py",
    "clients/**"
]

[tool.ruff.lint]
extend-select = ["T201"]


[tool.uv.sources]
graphsense-lib = { path="../graphsense-lib"}


[dependency-groups]
dev = [
    "gunicorn>=23.0.0",
    "pre-commit>=4.0.1",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
    "pytest-icdiff>=0.9",
    "pytest>=8.3.4",
    "ruff>=0.8.1",
    "testcontainers[cassandra,postgres]>=4.8.2",
    "graphsense-python>=1.9.4",
    "tqdm>=4.67.1",
]
